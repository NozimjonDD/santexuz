upstream @@APP_NAME@@_django {
    server unix:/run/@@APP_NAME@@-gunicorn.sock;
}
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://@@DOMAIN@@$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@DOMAIN@@;
    ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:@@APP_NAME@@_TLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 22m;
    # Do not record Telegram init data / query strings in access logs.
    access_log /var/log/nginx/@@APP_NAME@@.access.log santex_private;
    error_log /var/log/nginx/@@APP_NAME@@.error.log warn;

    # Django supplies frame-ancestors for Telegram Web; no global X-Frame-Options.
    location /static/ {
        alias @@APP_ROOT@@/shared/static/;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* ^/(media|private-media|storage)(/|$) { return 404; }
    location ~ /\. { return 404; }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root @@APP_ROOT@@/shared;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
    }
    location / {
        if (-f @@APP_ROOT@@/shared/maintenance.flag) { return 503; }
        proxy_pass http://@@APP_NAME@@_django;
        proxy_set_header Host $host;
        # Exactly one trusted proxy. Replace untrusted incoming forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_redirect off;
    }
}
