server {
        root /var/www/html;
        client_max_body_size 10M;

        # Add index to the list if you are using PHP
        index index.html index.htm index.nginx-debian.html;
        server_name myproject.uz; # managed by Certbot

        location / {
                # First attempt to serve request as file, then
                # as directory, then fall back to displaying a 404.
                # try_files $uri $uri/ =404;
                proxy_pass http://0.0.0.0:3000;
                proxy_set_header Host $host; # important header
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api {
                #proxy_pass http://127.0.0.1:8000;
                proxy_pass http://unix:/run/myproject.sock;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
                alias /home/dir/myproject/media/;
        }

        location /static/ {
                alias /home/dir/myproject/static/;
        }

}
