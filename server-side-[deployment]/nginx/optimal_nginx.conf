# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name led.nozim-dev.uz;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name led.nozim-dev.uz;

    client_max_body_size 5000M;

    # ─── SSL ─────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/led.nozim-dev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/led.nozim-dev.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/led.nozim-dev.uz/chain.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ─── OCSP Stapling ───────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ─── Security Headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ─── Logs ────────────────────────────────────────────────────
    error_log  /var/log/nginx/led/led-cloud-error.log;
    access_log /var/log/nginx/led/led-cloud-access.log;

    # ─── Gzip ────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ─── SPA Frontend ────────────────────────────────────────────
    location / {
        root  /var/local/demo/led-monitor-admin/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache Static Assets ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root    /var/local/demo/led-monitor-admin/dist/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── No Cache for index.html ─────────────────────────────────
    location = /index.html {
        root /var/local/demo/led-monitor-admin/dist/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ─── Block hidden files ───────────────────────────────────────
    location ~ /\. {
        deny all;
        log_not_found off;
    }
}
