[program:celerybeat]
directory=/path/to/your/project
command=/path/to/your/project/venv/bin/celery -A project beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
autostart=true
autorestart=true
stderr_logfile=/var/log/celerybeat.err.log
stdout_logfile=/var/log/celerybeat.out.log
environment=PATH="/path/to/your/project/venv/bin"
user=www-data
