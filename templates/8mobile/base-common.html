{% load static %}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block page_title %}Santex{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'miniapp/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'miniapp/app.css' %}">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <meta name="theme-color" content="#0b5fd8">
  <script type="module" src="{% static 'miniapp/app.js' %}"></script>
</head>
<body data-local-preview="{{ local_preview_enabled|yesno:'true,false' }}">
  {% block content %}{% endblock %}
</body>
</html>
