{% extends '8mobile/base-common.html' %}
{% block content %}
<a class="skip-link" href="#screen">Kontentga o‘tish</a>
<div class="app-shell">
  <header class="app-header">
    <a href="#home" class="brand" aria-label="Santex"><span class="brand-mark" aria-hidden="true">S</span><span>Santex<small>Marhamat · Mini App</small></span></a>
    <div class="header-actions">
      <label class="sr-only" for="language">Til / Язык / Language</label>
      <select id="language" class="language-select"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select>
      <button class="icon-button" id="notifications-button" type="button" aria-label="Bildirishnomalar"><span id="bell-icon" aria-hidden="true"></span><span id="notification-dot" class="notification-dot" hidden></span></button>
    </div>
  </header>
  {% if local_preview_enabled %}
  <aside class="preview-bar" id="dev-preview">
    {% csrf_token %}
    <span id="preview-label">Lokal ishlab chiqish rejimi</span>
    <button type="button" id="dev-login" class="text-button">Sinov akkaunti</button>
    <button type="button" id="design-preview" class="text-button">Dizaynni ko‘rish</button>
    <label id="demo-role-label" hidden><span class="sr-only">Rol</span><select id="demo-role"><option value="customer">Mijoz</option><option value="plumber">Usta</option><option value="store">Do‘kon</option></select></label>
  </aside>
  {% endif %}
  <div id="offline-banner" class="notice warning offline-banner" role="status" hidden></div>
  <main id="screen" tabindex="-1" aria-busy="true"><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><p>Santex yuklanmoqda…</p><div class="skeleton"></div><div class="skeleton short"></div></div></main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Asosiy navigatsiya"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="action-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" type="button" aria-label="Yopish">×</button></div><div id="dialog-content"></div></dialog>
<noscript><p class="notice">Mini Appdan foydalanish uchun JavaScriptni yoqing.</p></noscript>
{% endblock %}
