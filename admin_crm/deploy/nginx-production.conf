server {
    listen 80;
    listen [::]:80;
    server_name admin.titan-service.hh-academy.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.titan-service.hh-academy.uz;

    ssl_certificate /etc/letsencrypt/live/admin.titan-service.hh-academy.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.titan-service.hh-academy.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:admin_crm_TLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/admin-crm.access.log;
    error_log /var/log/nginx/admin-crm.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
