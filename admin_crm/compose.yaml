services:
  crm:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
